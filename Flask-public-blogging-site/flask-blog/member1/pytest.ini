[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    member1: Member 1 test suite
    forms: form validation tests
    markdown: Markdown rendering and sanitizing tests
    models: SQLAlchemy model tests
    ui: Flask test-client UI/rendering check
    csv_data: external CSV-driven test
    order(n): deterministic serial test order
	member2: Member 2 test suite
    routes: main blog routes
    auth: authentication routes
    app_factory: Flask application factory
